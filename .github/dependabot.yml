# Dependabot will run on day 24 of each month at 01:33 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "33 1 24 * *"
    open-pull-requests-limit: 20
    assignees:
      - "Author"
    versioning-strategy: "increase"
